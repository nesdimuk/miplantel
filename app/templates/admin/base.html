<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} · Mi Plantel</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">⚙️ Mi Plantel</span>
    {% if club is defined and club %}
      <a href="/admin/{{ club.slug }}">Hoy</a>
      <a href="/admin/{{ club.slug }}/jugadores">Jugadores</a>
      <a href="/admin/{{ club.slug }}/staff">Staff</a>
      <a href="/admin/{{ club.slug }}/categorias">Categorías</a>
      <a href="/admin/{{ club.slug }}/recordatorios">Recordatorios</a>
      <a href="/admin/{{ club.slug }}/alertas">Alertas</a>
      <a href="/d/{{ club.slug }}" style="font-weight:700;color:#fff">📊 Dashboard</a>
    {% endif %}
    <span class="right">
      {% if es_super %}<a href="/admin">Clubes</a> ·{% endif %}
      <a href="/admin/logout">Salir</a>
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
